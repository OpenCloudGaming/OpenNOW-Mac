name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  packages:
    name: Build and Test Packages
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          echo "Using macOS runner"
          uname -a
          swift --version
          xcodebuild -version
        shell: bash

      - name: Cache SwiftPM build graph
        uses: actions/cache@v4
        with:
          path: |
            .build
            !.build/shared/artifacts
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-v2-${{ github.event.repository.name }}-${{ hashFiles('Package.resolved', '**/Package.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-v2-${{ github.event.repository.name }}-

      - name: Build package workspace
        run: |
          set -euo pipefail
          swift build --scratch-path .build/shared || {
            echo "swift build failed; clearing scratch path and retrying with a clean build graph"
            rm -rf .build/shared
            swift build --scratch-path .build/shared
          }
        shell: bash

      - name: Run package unit tests
        run: |
          set -euo pipefail
          swift test --scratch-path .build/shared || {
            echo "swift test failed; clearing scratch path and retrying with a clean build graph"
            rm -rf .build/shared
            swift test --scratch-path .build/shared
          }
        shell: bash

      - name: Upload crash reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports
          path: ~/Library/Logs/DiagnosticReports/
          if-no-files-found: ignore

  app-build:
    name: Build macOS App
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          echo "Using macOS runner"
          uname -a
          swift --version
          xcodebuild -version
        shell: bash

      - name: Build MacForceNow
        run: |
          set -euo pipefail
          xcodebuild build \
            -project MacForceNow.xcodeproj \
            -scheme MacForceNow \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_COMPILATION_MODE=singlefile
        shell: bash
