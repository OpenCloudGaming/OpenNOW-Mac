name: Sync Upstream

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Mirror upstream with fork workflows preserved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/OpenCloudGaming/OpenNOW-Mac.git
          git fetch upstream main
          git checkout -b upstream/main upstream/main
          git rm -rf .github/workflows/ 2>/dev/null || true
          git checkout origin/main -- .github/workflows/
          git add .github/workflows/
          git commit -m "chore: keep fork workflows during upstream sync" --allow-empty || true
          git push origin "upstream/main" --force

      - name: Check for changes
        run: |
          git fetch origin main
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "BEHIND=false" >> $GITHUB_OUTPUT
          else
            echo "BEHIND=true" >> $GITHUB_OUTPUT
          fi
        id: status

      - name: Open PR
        if: steps.status.outputs.BEHIND == 'true'
        run: |
          gh pr create \
            --base main \
            --head upstream/main \
            --title "chore: sync upstream" \
            --body "Upstream has new commits. Review and merge into main." \
            --label "upstream-sync" || true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
